name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be triggered by hand from the Actions tab, which is the quickest
  # way to confirm a fix without pushing an empty commit.
  workflow_dispatch:

# A second push to the same branch cancels the first. Without this, a quick
# follow-up commit leaves the earlier run burning minutes on code nobody will
# merge. `main` is excluded from cancellation so its history stays fully checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every third-party action is pinned to a commit, not a tag. A tag is a mutable
# pointer the action's owner can move, and `deploy` hands whatever it resolves
# to a Cloudflare API token that can rewrite the live Worker. Pinning means an
# upgrade is a reviewed diff in this file rather than something that happens to
# a repository overnight. The version each SHA belongs to is in the comment.

jobs:
  # Runs first and independently of the build. A commit message cannot be fixed
  # by a follow-up commit — it needs a rebase — so it is better to find out in
  # thirty seconds than after a four-minute build.
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The check compares two commits, so the full history has to be here.
          # The default shallow clone has neither end of the range.
          fetch-depth: 0
          # Nothing here pushes. Left on, checkout writes the job's token into
          # .git/config, where any later step or script could read and use it.
          persist-credentials: false

      - name: Reject Co-Authored-By trailers
        env:
          # `pull_request` carries base and head explicitly; `push` does not, so
          # it falls back to the range that was pushed.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # A new branch reports an all-zero "before", and a manual dispatch
          # reports none at all. Both fall back to the tip commit alone.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="${HEAD}~1..${HEAD}"
          else
            range="${BASE}..${HEAD}"
          fi

          echo "Checking $range"
          failed=0

          for sha in $(git rev-list "$range"); do
            if git log -1 --format='%B' "$sha" | grep -qiE '^[[:space:]]*co-authored-by:'; then
              subject=$(git log -1 --format='%s' "$sha")
              echo "::error::${sha:0:8} has a Co-Authored-By trailer — $subject"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Commits in this branch must not carry Co-Authored-By trailers."
            echo "Strip them and force-push:"
            echo ""
            echo "  git filter-branch -f --msg-filter \\"
            echo "    \"sed -E '/^[Cc]o-[Aa]uthored-[Bb]y:/d'\" main..HEAD"
            echo "  git push --force-with-lease"
            exit 1
          fi

          echo "No Co-Authored-By trailers found."

  # ---------------------------------------------------------------------------
  # Supply chain
  # ---------------------------------------------------------------------------
  #
  # Cheap, no build, and a blocker for the deploy. Everything here is a class of
  # mistake that survives a green test suite: a dependency with a known hole, a
  # lockfile quietly pointing somewhere other than the registry, or a secret
  # given a VITE_ name and therefore compiled into the browser bundle.
  audit:
    name: Dependencies and secret names
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails if the lockfile disagrees with package.json, but it is
      # happy to install from anywhere the lockfile names. A `resolved` URL
      # pointing at a tarball someone controls is how a dependency gets swapped
      # without the version number moving, and it is invisible in a diff of
      # package.json alone.
      - name: Lockfile resolves only to the public registry
        run: |
          set -euo pipefail
          foreign=$(grep -oE '"resolved": *"[^"]+"' package-lock.json \
            | grep -v 'https://registry.npmjs.org/' || true)
          if [ -n "$foreign" ]; then
            echo "::error::package-lock.json resolves outside the public npm registry"
            echo "$foreign"
            exit 1
          fi
          echo "All lockfile entries resolve to registry.npmjs.org."

      # Scoped to what actually ships. A high-severity advisory in a build tool
      # that never runs in production should not be able to block a deploy, and
      # treating those two cases the same is how an audit gate gets switched off.
      #
      # npm 10.9 (npm 10.9.9 on node 22.23.3, the version this job's setup-node
      # installs) posts to the bulk advisory endpoint and only falls back to the
      # retired /-/npm/v1/security/audits/quick when that request does not answer
      # at all. The fallback answers `400 Invalid package tree, run npm install to
      # rebuild your package-lock.json`, which reads like a broken lockfile and is
      # not one: it is npm reporting that the bulk request never completed. That
      # took main's deploy down twice on 2026-10-22 (runs 39738568520 and
      # 39740776619), five minutes each, both green on a re-run of the same tree.
      #
      # So this step separates the two things npm can say: a verdict about the
      # dependencies, and a failure to reach the endpoint. A verdict is final and
      # is never retried; an endpoint failure is retried a bounded number of times
      # and then exits red, because a gate that gives up quietly is worse than one
      # that blocks.
      - name: Audit production dependencies
        timeout-minutes: 6
        env:
          # The five-minute gap in both failing runs is npm-registry-fetch's
          # default 300 s response timeout on the bulk POST (`npm config get
          # fetch-timeout` -> 300000). A working registry measured 0.7 s here with
          # only the lockfile to send, and 5.9 s with node_modules installed, so
          # 60 s is slack rather than a squeeze, and it keeps three whole attempts
          # inside this job instead of one attempt inside fifteen minutes.
          npm_config_fetch_timeout: 60000
          # The loop below is the retry policy; npm's own retries would multiply it.
          npm_config_fetch_retries: 0
          # Names the endpoint npm actually talked to, so a failure reads
          # "bulk 503, then quick 400" instead of only the 400.
          npm_config_loglevel: http
        run: |
          set -euo pipefail

          # What npm prints when it never got an answer: the audit request itself
          # failed (any non-2xx, including the retired quick endpoint's 400), the
          # registry answered 5xx, or the socket died. None of these is a statement
          # about the dependency tree.
          no_verdict='audit endpoint returned an error|[Ii]nvalid package tree|endpoint is being retired|npm http fetch.* 5[0-9][0-9]( |$)|npm warn audit 5[0-9][0-9]( |$)|statusCode: 5[0-9][0-9]|EAI_AGAIN|ECONNRESET|ETIMEDOUT|ECONNREFUSED|ENOTFOUND|ECONNABORTED|socket hang up'

          for attempt in 1 2 3; do
            if output=$(npm audit --omit=dev --audit-level=high 2>&1); then
              echo "$output"
              exit 0
            else
              # A failed `if` compound without an `else` has status zero in bash.
              # Capture npm's status in the `else` so a vulnerability cannot turn
              # into a green audit after the retry loop.
              code=$?
            fi
            echo "$output"

            # A report is a verdict, and a verdict outranks any endpoint noise that
            # came with it: npm can fetch the advisory list and still fail to fetch
            # a packument while working out whether a fix exists, and retrying that
            # would bury a real high-severity advisory behind "the registry was
            # flaky". Checked before the retryable class on purpose.
            if printf '%s\n' "$output" | grep -q '# npm audit report'; then
              echo "::error::npm audit found vulnerable production dependencies. This is an advisory verdict, not a registry error, and it is not retried."
              exit "$code"
            fi

            if ! printf '%s\n' "$output" | grep -qiE "$no_verdict"; then
              echo "::error::npm audit failed without reporting an advisory or a recognisable endpoint error; see the output above. Not retried."
              exit "$code"
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm audit got no answer from the registry in $attempt attempts. That is the audit endpoint failing, not a vulnerable dependency: re-run the job, and if it keeps failing the endpoint itself is down."
              exit "$code"
            fi
            echo "npm audit got no verdict from the registry (attempt $attempt/3); retrying in $((attempt * 10))s..."
            sleep "$((attempt * 10))"
          done

      # Vite compiles every VITE_-prefixed variable into the bundle every
      # visitor downloads. Naming a server secret VITE_SOMETHING is therefore
      # not a leak that happens at runtime — it is one that happens at build
      # time, silently, and ships. Catch the name before it ever holds a value.
      - name: No server secrets under a VITE_ name
        run: |
          set -euo pipefail
          pattern='VITE_[A-Z0-9_]*(SECRET|SERVICE_ROLE|PRIVATE_KEY|API_KEY|PASSWORD|TOKEN)'
          # Two greps, not one. --include filters explicitly named files as well
          # as recursed ones, so listing .env.example alongside the source globs
          # silently drops it — and the example file is exactly where a bad name
          # gets copied from.
          hits=$( { grep -rInE "$pattern" \
                      --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.js' \
                      --exclude-dir=node_modules src scripts
                    grep -nE "$pattern" .env.example
                  } 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::a server secret is named VITE_ and would be compiled into the client bundle"
            echo "$hits"
            exit 1
          fi
          echo "No VITE_-prefixed secret names."

  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Vite inlines VITE_-prefixed variables at build time, and
      # src/lib/supabase/client.ts reads two of them at module scope. These are
      # obvious throwaways so that a build failure here can never be mistaken
      # for a credential problem, and so that nothing real is needed to verify a
      # pull request. The build is checked, not run — no request is ever made to
      # this host.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins and fails if package.json and the lockfile disagree, so a
      # dependency cannot drift between a developer's machine and CI.
      - name: Install
        run: npm ci

      # Each check is its own step so a red run names what broke in the job
      # summary, instead of one "npm run ci" that could have failed anywhere.
      # They run in ascending order of cost: types, then lint, then the build.
      # The suite moved to its own job below, where it can be split.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The install contract, checked against the artifact the build just
      # emitted rather than against a deployment. It reads .output/public, so it
      # has to come after the build, and it is deliberately *not* a live check:
      # a build gate that fetches production would fail for reasons that have
      # nothing to do with the commit under test. The live half runs in the
      # deploy job, after the Worker is serving.
      - name: PWA install contract
        run: npm run pwa:self-test

      # The route walk's own self-test, and for the same reason the PWA one is
      # here. `scripts/route-walk.mjs` is what the deploy job and the nightly
      # health workflow both trust to tell them whether production is serving; a
      # check that has never failed proves nothing, and its self-test costs about
      # a second. It breaks nine things on purpose — a wrong title, an empty
      # body, a rendered `undefined`, a missing chunk — and the suite has to
      # report all nine. A change to the checker that made it stop reporting them
      # fails here, rather than reporting production healthy for weeks.
      #
      # It needs no network and no build, so it sits with the other self-tests
      # rather than in the e2e job.
      - name: Route walk self-test
        run: npm run route:walk:self-test

      # The origin check's self-test, for the same reason again. This is the
      # check that would have caught the product publishing `nyuz.app` as its own
      # canonical address while answering on `nyuz.grgvishal-gurung17.workers.dev`
      # -- a defect that survived weeks of green runs because every surface was
      # internally consistent and nothing compared them. It breaks eight things
      # on purpose: a canonical, an OpenGraph image, a sitemap entry and a robots
      # sitemap line each moved to another origin, a page missing its canonical, a
      # robots file with no sitemap line, an unserved sitemap, and one committed
      # origin that does not answer.
      - name: Origin check self-test
        run: npm run origin:self-test

  # ---------------------------------------------------------------------------
  # The suite, in four shards
  # ---------------------------------------------------------------------------
  #
  # 2751 tests in 163 files take a bit under five minutes on one runner, and the
  # checks below add to that — so the suite is split rather than trimmed. Vitest
  # partitions by file, so a shard cannot leak state into another, and each shard
  # is a separate runner: the wall clock is the slowest quarter, not the sum.
  #
  # `fail-fast: false` is deliberate. With one shard cancelling the rest, the run
  # reports only the first failure alphabetically and the next push reveals the
  # second. Every shard reports, so one pass over the failures fixes all of them.
  test:
    name: Test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      # Only src/lib/supabase/client.ts reads these, at module scope, and it is
      # imported by suites that assert on URLs rather than by anything that
      # calls out. The same throwaways as `verify`, for the same reason.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `--reporter=github` annotates the failing assertion on the diff itself,
      # which is the difference between reading a log and opening a file.
      - name: Test
        run: npm run test:shard -- ${{ matrix.shard }}/4

  # ---------------------------------------------------------------------------
  # Coverage, measured and ratcheted
  # ---------------------------------------------------------------------------
  #
  # The suite runs a second time here, with instrumentation, and that is a
  # deliberate cost rather than an oversight. A ratchet needs one coherent
  # measurement of the whole tree; merging four shards' v8 reports would measure
  # each shard against files it never loaded, and a number that is subtly wrong
  # is worse than a job that is three minutes slower. The alternative — no
  # coverage gate at all — means the 2751 tests stop being a floor and become a
  # snapshot.
  #
  # It gates the deploy. Everything about this job is about what the *suite*
  # covers, so a commit that adds a module with no tests takes the deploy down
  # with it until either the module is tested or the floor is raised on purpose.
  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Measure
        run: npm run test:coverage

      # Compares against .ci/baseline/coverage.json, per directory and in total.
      # Fails on a decrease only, and writes the table to the job summary.
      - name: Ratchet
        run: npm run coverage:ratchet

      # The raw summary, so a red run can be read without re-running it. Small
      # (one JSON file) and short-lived; `retention-days` keeps it from piling up.
      #
      # `continue-on-error` is here because artifact storage is an *account*
      # quota on GitHub's free plan, and on 2026-10-12 it was already full before
      # this repo uploaded anything: all 48 artifacts in this repository total
      # 248 KB, and the upload failed `Failed to CreateArtifact: Artifact storage
      # quota has been hit` while every check in this job had passed -- which
      # skipped the deploy job and left readers on the old build. The gate is the
      # Ratchet step above; this upload is the archival copy that exists only so
      # the floor can be recorded from the runner (`gh run download <run-id> -n
      # coverage-summary`), an operation that happens when the floor moves, not
      # on every run. A quota this repository does not own must not hold the
      # deploy hostage -- that is the shape of failure this repo keeps meeting,
      # where an unrelated condition hides finished work from readers. If the
      # upload is skipped, recording the floor needs the artifact from a run
      # where it succeeded; nothing about the measurement changes.
      - name: Keep the measurement
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The browser, against the artifact that deploys
  # ---------------------------------------------------------------------------
  #
  # Every other job here reads source. This one loads the built Worker in
  # Chromium, which is the only way to see the failure a green unit suite cannot:
  # a module-scope throw in the client entry, a route file that does not import,
  # a page that answers 200 with an error page in it. It blocks the deploy.
  #
  # `npm run e2e` builds inside its own webServer command, so the artifact under
  # test is always the one this commit produces — never one left over from
  # `verify`, which builds with the same placeholders but for a different job.
  #
  # No credentials: `wrangler dev --local` never contacts Cloudflare, and the
  # public pages read site content through a path that falls back to the bundled
  # copy, so they render without a database. See playwright.config.ts.
  e2e:
    name: Browser smoke on the built Worker
    needs: [commits, audit, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `--with-deps` because a bare Chromium download still needs the system
      # libraries it links against, and a missing one shows up as a launch
      # failure several steps later. Not cached: the download is about forty
      # seconds, and a cache populated by an earlier run is a second supply
      # chain to reason about for no gain.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Both specs: `smoke.spec.ts` proves each page renders, `interaction.spec.ts`
      # proves the four client-side things a render walk cannot see — the billing
      # toggle, the sign-in flow's address step, the support mailboxes and the
      # theme. One Worker serves both, so they cost one build and one boot.
      - name: Browser smoke
        run: npm run e2e

      # Traces and screenshots from a failed run. A browser assertion that fails
      # in CI is hard to reproduce locally, and the trace is the whole story:
      # DOM at the moment of failure, network log, console output.
      # Evidence only -- Playwright's own exit code is what fails this job. Same
      # account-quota reason as the coverage summary above: when storage is full,
      # a failing browser run must not be reported as two failures.
      - name: Keep the evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Deploy
  # ---------------------------------------------------------------------------
  #
  # Runs only for a push to main, and only once every check above is green —
  # `needs` is what makes a red test unshippable rather than merely
  # embarrassing, and it now names the browser suite and the coverage floor as
  # well as the four the build depends on. A pull request builds and is checked;
  # it never deploys.
  #
  # The build is repeated here rather than carried over from `verify` as an
  # artifact, and that is deliberate. Vite inlines every VITE_-prefixed variable
  # at build time, and `verify` builds with obvious placeholders so a pull
  # request needs no real configuration. Shipping that artifact would put
  # https://ci-placeholder.supabase.co into the bundle every visitor downloads,
  # and src/lib/supabase/client.ts would throw on the first page load. The
  # deployable bundle has to be built with the real values, so it is built here.
  deploy:
    name: Deploy to Cloudflare Workers
    needs: [commits, audit, verify, test, coverage, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A GitHub Environment, so the Cloudflare credentials are scoped to this job
    # and to main rather than readable by any workflow in the repository. Add a
    # required reviewer on it if a deploy should ever need a human.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    # Two pushes in quick succession would otherwise race, and whichever wrangler
    # finished last would win regardless of which commit was newer. Queued rather
    # than cancelled: a half-finished deploy is worse than a redundant one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read

    env:
      # Public by design — Vite compiles all four into the browser bundle, so
      # they are repository *variables*, not secrets. The anon key is meant to be
      # public; RLS (0002_rls.sql) is what protects the data. Anything genuinely
      # secret is a Worker secret set with `wrangler secret put` and is not here.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # An unset variable is not a build failure — Vite inlines `undefined` and
      # the bundle ships. The page then throws for every visitor at module scope,
      # which is a broken deployment that CI called green. Cheaper to refuse.
      - name: Require the build-time configuration
        run: |
          set -euo pipefail
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_SITE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository variable $name is not set"
              missing=1
            fi
          done
          case "${VITE_SUPABASE_URL:-}" in
            *ci-placeholder*)
              echo "::error::VITE_SUPABASE_URL is the CI placeholder, not a real project"
              missing=1
              ;;
          esac
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Set them under Settings > Secrets and variables > Actions > Variables."
            echo "All three are public by design — they are compiled into the browser bundle."
            exit 1
          fi

      - name: Install
        run: npm ci

      # Writes .output/ plus .wrangler/deploy/config.json, which is how wrangler
      # finds the generated .output/server/wrangler.json without being told. The
      # worker name and the three cron triggers come from vite.config.ts.
      - name: Build
        run: npm run build

      # The last check before anything leaves the runner, and the only one that
      # inspects the artifact rather than the source. `audit` rejects a secret
      # given a VITE_ name; this rejects a secret that reached the bundle any
      # other way — pasted into a component, pulled in by a dependency, left in
      # a fixture. A published bundle cannot be recalled: every visitor who
      # loaded it has a copy, so the check has to happen before the deploy and
      # not after it.
      #
      # `set -e` is deliberately absent. Both loops are driven by greps that
      # exit non-zero on the healthy no-match case, which is the outcome this
      # step wants. The verdict is the `found` flag at the end.
      - name: Scan the client bundle for secrets
        run: |
          set -uo pipefail
          found=0

          # Distinctive enough that a hit in minified JavaScript is a leak and
          # not a coincidence: Stripe secret, restricted and webhook-signing
          # keys, Resend, OpenAI-style keys, and a Telegram bot token.
          while IFS= read -r hit; do
            echo "::error::client bundle contains what looks like a secret — ${hit%%:*}"
            found=1
          done < <(grep -rIoE \
            'sk_(live|test)_[A-Za-z0-9]{16,}|rk_(live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|re_[A-Za-z0-9_-]{24,}|sk-[A-Za-z0-9_-]{32,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' \
            .output/public)

          # Supabase keys are JWTs and both of them look alike, so a prefix
          # cannot tell them apart — the role is inside the payload. The anon
          # key belongs in the bundle and RLS constrains it. A service_role key
          # bypasses RLS entirely, so shipping one hands every visitor
          # unrestricted access to the database.
          while IFS= read -r hit; do
            file="${hit%%:*}"
            body="${hit#*:}"
            body="${body#*.}"
            body="${body%%.*}"
            pad=$(( ${#body} % 4 ))
            if [ "$pad" -ne 0 ]; then
              body="${body}$(printf '=%.0s' $(seq $((4 - pad))))"
            fi
            role=$(printf '%s' "$body" | tr '_-' '/+' | base64 -d 2>/dev/null \
              | grep -oE '"role" *: *"[^"]+"' | head -1 | grep -oE '"[^"]+"$' | tr -d '"')
            if [ -n "${role:-}" ] && [ "$role" != "anon" ]; then
              echo "::error::client bundle carries a '$role' JWT — $file"
              found=1
            fi
          done < <(grep -rIoE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
            .output/public)

          if [ "$found" -ne 0 ]; then
            echo ""
            echo "Nothing was deployed. Rotate anything printed above before"
            echo "pushing a fix — it is in the repository's build log now."
            exit 1
          fi
          echo "No secrets found in .output/public."

      # wrangler is pinned, here and in package.json, to the same version: the
      # e2e job serves the built output with this wrangler's local runtime, and
      # a preview that ran an older runtime than production would be a weaker
      # proof than it looks. `toolchain-consistency.test.ts` fails if the two
      # drift apart.
      #
      # It was bumped to 4.147.0 because the build stamps `compatibility_date`
      # as the day it ran, and 4.126.0's local runtime tops out at 2026-09-01 --
      # by 2026-10-03 the artifact could be deployed but not previewed, which
      # means it could not be tested either.
      #
      # The action's `secrets:` input is deliberately unused. Routing the service
      # role key and the provider keys through GitHub to set them on every deploy
      # would put a second copy of every secret in a second system for no gain:
      # `wrangler deploy` leaves existing Worker secrets untouched, so they are
      # set once with `wrangler secret put` and live only on Cloudflare. See
      # docs/security.md.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: deploy

      # A successful `wrangler deploy` means Cloudflare accepted the upload, not
      # that the Worker runs. A module-scope throw -- the exact failure the
      # configuration check above guards against -- uploads perfectly and then
      # 500s for every visitor. A single `curl` on `/` is not enough either:
      # Cloudflare serves the document from the asset manifest, so a 200 on `/`
      # is compatible with a bundle that never boots, references a missing chunk,
      # or renders an error page inside a 200.
      #
      # So this reads the body of every public page and the assets it names. The
      # retries are inside the script because a fresh deploy propagates to the
      # edge asynchronously and the first answer is often the previous build.
      - name: Walk every public page on the deployment
        env:
          TARGET: ${{ steps.deploy.outputs.deployment-url || vars.VITE_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET:-}" ]; then
            echo "::error::No deployment URL and no VITE_SITE_URL to check"
            exit 1
          fi
          node scripts/route-walk.mjs "$TARGET"

      # The assertion the 2026-10-12 ruling required by name: a deployment must
      # publish ONE origin across the pages, `robots.txt` and the sitemap, and
      # that origin must serve the site. Until this step existed, a build could
      # declare `https://nyuz.app` in every canonical while answering on
      # workers.dev, and the walk above would still pass — it reads the pages it
      # was given, and each page was internally consistent.
      #
      # `steps.deploy.outputs.deployment-url` is preferred for the same reason as
      # the walks above, and the origin the pages name is reported rather than
      # required to equal it: a preview may legitimately be built with the
      # production origin, and a check that fails on that is switched off.
      - name: Assert the deployment publishes one origin
        env:
          TARGET: ${{ steps.deploy.outputs.deployment-url || vars.VITE_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET:-}" ]; then
            echo "::error::No deployment URL and no VITE_SITE_URL to check"
            exit 1
          fi
          node scripts/origin-check.mjs "$TARGET"

      # The half of the install contract that only a deployment can answer:
      # whether Cloudflare is serving the manifest the browser accepts, icons
      # whose bytes match their declared sizes, a document that links the
      # manifest with `viewport-fit=cover`, and a worker that caches the shell
      # without ever caching a per-account response. The self-test in `verify`
      # proves the artifact; this proves the origin.
      # Retried like the route walk above, because a fresh deploy can answer on
      # the document before every asset is being served from the colo.
      - name: Check the deployment's install contract
        env:
          TARGET: ${{ steps.deploy.outputs.deployment-url || vars.VITE_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET:-}" ]; then
            echo "::warning::No deployment URL to check"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "attempt $attempt"
            if node scripts/pwa-check.mjs "$TARGET"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$TARGET does not satisfy the install contract — see the checks above"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Worker: \`nyuz\`"
            echo "- Commit: \`${GITHUB_SHA:0:8}\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
            echo ""
            echo "Cron Triggers are registered from the deploy. Cloudflare takes"
            echo "three per Worker — confirm all three are listed in the dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
